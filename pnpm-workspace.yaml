packages:
  - packages/*
allowBuilds:
  "@nestjs/core": true
  "@swc/core": true
  core-js: true
  esbuild: true
  nx: true

catalog:
  "@napi-rs/cli": 3.10.0
  vite-plus: 0.3.1

overrides:
  "@emnapi/core": ^2.0.0-alpha.4
  "@emnapi/runtime": ^2.0.0-alpha.4

verifyDepsBeforeRun: install

minimumReleaseAgeExclude:
  - "@oxc-project/*"
