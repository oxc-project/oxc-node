packages:
  - packages/*
allowBuilds:
  "@nestjs/core": true
  "@swc/core": true
  core-js: true
  esbuild: true
  nx: true

catalog:
  "@napi-rs/cli": 3.10.4
  vite-plus: 0.3.3

overrides:
  "@emnapi/core": ^2.0.0-alpha.5
  "@emnapi/runtime": ^2.0.0-alpha.5

verifyDepsBeforeRun: install

minimumReleaseAgeExclude:
  - "@napi-rs/*"
  - "@oxc-project/*"
  - "@oxfmt/*"
  - "@oxlint/*"
  - "@oxlint-tsgolint/*"
  - "@vitest/*"
  - "@voidzero-dev/*"
  - oxfmt
  - oxlint
  - vite-plus
  - vitest
