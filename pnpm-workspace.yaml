packages:
  - packages/*
allowBuilds:
  "@nestjs/core": true
  "@swc/core": true
  core-js: true
  esbuild: true
  nx: true

catalog:
  "@napi-rs/cli": 3.10.12
  vite-plus: 1.3.0

verifyDepsBeforeRun: install
# CI installs on the host and tests foreign arch/libc targets in containers,
# so --force must fetch optional native deps for all platforms.
forceIgnoresPlatform: true

minimumReleaseAgeExclude:
  - "@napi-rs/*"
  - "@oxc-project/*"
  - "@oxfmt/*"
  - "@oxlint/*"
  - "@oxlint-tsgolint/*"
  - "@vitest/*"
  - "@voidzero-dev/*"
  - oxfmt
  - oxlint
  - vite-plus
  - vitest
