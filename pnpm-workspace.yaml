packages:
  - packages/*
allowBuilds:
  "@nestjs/core": true
  "@swc/core": true
  core-js: true
  esbuild: true
  nx: true

catalog:
  "@napi-rs/cli": 3.10.8
  vite-plus: 1.0.0

overrides:
  "@emnapi/core": ^2.0.0-alpha.5
  "@emnapi/runtime": ^2.0.0-alpha.5

verifyDepsBeforeRun: install
# CI installs on the host and tests foreign arch/libc targets in containers,
# so --force must fetch optional native deps for all platforms.
forceIgnoresPlatform: true

minimumReleaseAgeExclude:
  - "@napi-rs/*"
  - "@oxc-project/*"
  - "@oxfmt/*"
  - "@oxlint/*"
  - "@oxlint-tsgolint/*"
  - "@vitest/*"
  - "@voidzero-dev/*"
  - oxfmt
  - oxlint
  - vite-plus
  - vitest
