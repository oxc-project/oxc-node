[package]
name = "oxc-node"
version = "0.0.0"
authors = ["LongYinan <github@lyn.one>"]
edition = "2024"
license = "MIT"
publish = false

[lib]
# `rlib` lets `cargo test` link unit tests against the library; the napi build
# only consumes the `cdylib` artifact.
crate-type = ["cdylib", "rlib"]

[features]
default = ["napi"]

# Compiles the `#[napi]` attributes that register this crate's exports on the
# addon. Disable it (`default-features = false`) when linking oxc-node as a
# library into another Node-API addon: napi-rs registers every `#[napi]` item
# of every linked crate into one module, so these exports would collide with
# or pollute the host's (issue #807).
#
# The embedder writes its own thin `#[napi]` forwarders — for `create_resolve`,
# `load`, `transform`, `OxcTransformer`, `set_tsconfig_path`,
# `get_tsconfig_path`, `set_transform_deps`, `get_transform_deps`,
# `transforms_dep`, `freeze_transform_deps`, and for watch mode
# `enable_watch_report` and `take_watch_dependencies` — compiling this crate against
# the same napi 3.x version so the `Function`, `PromiseRaw`, `Either` and
# `FnArgs` types used in those signatures unify with the host's. It also calls
# `detect_runtime_syntax` from its own `napi(module_exports)` hook (without it
# `using`/`await using` stay lowered even on Node.js >= 24) and `init_tracing`
# for `OXC_LOG` logging — neither runs by itself with the feature off.
#
# The `#[napi(object)]` structs and `FromNapiValue` impls stay compiled so
# their marshalling can be reused — but napi-derive still writes their type
# definitions into the folder `napi build` concatenates into the generated
# `index.d.ts`, so a host's `.d.ts` gains oxc-node's interfaces and must not
# redeclare names like `ResolveContext` itself (interface merging). `Output`
# is a `#[napi]` class instead and loses `ToNapiValue`/`TypeName` with the
# feature off, so `transform` results are handed to the host's own JS-facing
# type through `source()`/`source_map()`; likewise `transform_async` and its
# `Task` surface are compiled out entirely.
#
# `napi` and `napi-derive` remain dependencies either way — core code uses
# `napi` types (`Either`, `Function`, `PromiseRaw`, `Env`) throughout.
# `mimalloc-safe` comes in only through this feature, so disabling it already
# drops mimalloc together with the `#[global_allocator]` declaration; enabling
# `default_global_allocator` on top of `default-features = false` changes
# nothing.
napi = ["dep:mimalloc-safe"]

# Leave the global allocator to the host. Enable this when linking oxc-node
# into another binary that keeps `napi` on but declares its own
# `#[global_allocator]` (a binary can only have one); with
# `default-features = false` the allocator is already gone, so the feature is
# a no-op there. Named after `rolldown_binding`'s feature, so an addon linking
# both enables the same feature on each. The published packages keep mimalloc.
default_global_allocator = []

# oxc_resolver's `yarn_pnp` feature changes the signature of
# `FileSystem::new`, which oxc-node implements for its watch-mode file
# system. An embedder whose build turns `oxc_resolver/yarn_pnp` on (through
# `oxc_resolver_napi`, for one) has to enable this too, or the crate does
# not compile. oxc-node itself never resolves through Yarn PnP.
yarn_pnp = ["oxc_resolver/yarn_pnp"]

[dependencies]
memchr = "2"
napi = { version = "3.12.2", default-features = false, features = ["serde-json", "napi3"] }
napi-derive = { version = "3.6.3", default-features = false, features = ["type-def"] }
oxc = { version = "0.154.0", features = [
  "ast_visit",
  "codegen",
  "transformer",
  "semantic",
  "regular_expression",
] }
oxc_resolver = { version = "11.24.3" }
oxc_sourcemap = "9"
phf = { version = "0.14", features = ["macros"] }
serde_json = "1"
simdutf8 = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "std",
  "fmt",
] } # Omit the `regex` feature

[target.'cfg(all(not(target_os = "linux"), not(target_os = "freebsd"), not(target_arch = "arm"), not(target_arch = "x86"), not(target_family = "wasm"), not(all(target_os = "windows", target_arch = "aarch64"))))'.dependencies]
# `optional` + `dep:` in the `napi` feature keeps embedders
# (`default-features = false`) from compiling mimalloc for a
# `#[global_allocator]` that can never be declared under them.
mimalloc-safe = { version = "0.1", features = ["skip_collect_on_exit"], optional = true }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
mimalloc-safe = { version = "0.1", features = [
  "skip_collect_on_exit",
  "local_dynamic_tls",
], optional = true }

# UTS #46 host canonicalization for the Windows UNC authority handling; only
# Windows production builds compile it. It is also a dev-dependency so the
# `#[cfg(any(windows, test))]` module's unit tests link on every platform.
[target.'cfg(windows)'.dependencies]
idna = "1.1.0"

[dev-dependencies]
idna = "1.1.0"

[build-dependencies]
napi-build = "2"

[profile.release]
codegen-units = 1
lto = true
strip = "symbols"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
