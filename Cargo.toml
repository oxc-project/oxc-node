[package]
name = "oxc-node"
version = "0.0.0"
authors = ["LongYinan <github@lyn.one>"]
edition = "2024"
license = "MIT"
publish = false

[lib]
# `rlib` lets `cargo test` link unit tests against the library; the napi build
# only consumes the `cdylib` artifact.
crate-type = ["cdylib", "rlib"]

[dependencies]
memchr = "2"
napi = { version = "3.12.2", default-features = false, features = ["serde-json", "napi3"] }
napi-derive = { version = "3.6.3", default-features = false, features = ["type-def"] }
oxc = { version = "0.149.0", features = [
  "codegen",
  "transformer",
  "semantic",
  "regular_expression",
] }
oxc_resolver = { version = "11.24.3" }
oxc_sourcemap = "8"
phf = { version = "0.14", features = ["macros"] }
serde_json = "1"
simdutf8 = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "std",
  "fmt",
] } # Omit the `regex` feature

[target.'cfg(all(not(target_os = "linux"), not(target_os = "freebsd"), not(target_arch = "arm"), not(target_arch = "x86"), not(target_family = "wasm"), not(all(target_os = "windows", target_arch = "aarch64"))))'.dependencies]
mimalloc-safe = { version = "0.1", features = ["skip_collect_on_exit"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
mimalloc-safe = { version = "0.1", features = ["skip_collect_on_exit", "local_dynamic_tls"] }

# UTS #46 host canonicalization for the Windows UNC authority handling; only
# Windows production builds compile it. It is also a dev-dependency so the
# `#[cfg(any(windows, test))]` module's unit tests link on every platform.
[target.'cfg(windows)'.dependencies]
idna = "1.1.0"

[dev-dependencies]
idna = "1.1.0"

[build-dependencies]
napi-build = "2"

[profile.release]
codegen-units = 1
lto = true
strip = "symbols"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
